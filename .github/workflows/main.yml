name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o KAAMI-IVAS.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python venv and dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-venv

      - name: Download Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

      - name: Accept SDK licenses and install components
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: KAAMI-IVAS-App/kaami-ivas
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Show Kotlin compilation error log
        if: failure()
        run: |
          find KAAMI-IVAS-App/kaami-ivas/app/build -name "*.log" -exec cat {} + || true

      - name: Check APK existence
        run: |
          echo "Checking built APKs:"
          find KAAMI-IVAS-App/kaami-ivas -name "*.apk" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAAMI-IVAS-debug-apk
          path: KAAMI-IVAS-App/kaami-ivas/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
